name: Release

# Builds packages for Linux, Windows and macOS (tools/package.sh) on a version tag, or by hand
# from the Actions tab (artifacts only). A tag also publishes a GitHub release with the archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest runner image for the widest glibc compatibility.
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the build id (git describe)
      - name: Tag matches the Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "tag ${GITHUB_REF_NAME} does not match Cargo version ${v}"; exit 1; }
      - name: System packages (Linux: raylib build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - name: Package
        shell: bash
        run: tools/package.sh ${{ matrix.name }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: tanks-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
